{% extends "base.html" %}

{% block title %}Sign Up - KD Ice Cream{% endblock title %}

{% block body %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <i class="bi bi-snow2 fs-1 text-primary"></i>
            <h2 class="mt-2">Create Account</h2>
            <p class="text-muted">Join KD Ice Cream to start ordering!</p>
          </div>

          <form method="post" action="{% url 'signup' %}" novalidate>
            {% csrf_token %}

            <div class="mb-3">
              <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="Min 6 characters" required minlength="6">
              </div>
            </div>

            <div class="mb-4">
              <label for="confirm_password" class="form-label">Confirm Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required minlength="6">
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg">
              <i class="bi bi-person-plus"></i> Sign Up
            </button>
          </form>

          <hr>
          <p class="text-center mb-0">
            Already have an account? <a href="{% url 'login' %}" class="fw-bold text-decoration-none">Login here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock body %}
