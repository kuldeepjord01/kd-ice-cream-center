{% extends "base.html" %}

{% block title %}Login - KD Ice Cream{% endblock title %}

{% block body %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <i class="bi bi-snow2 fs-1 text-primary"></i>
            <h2 class="mt-2">Welcome Back</h2>
            <p class="text-muted">Login to your KD Ice Cream account</p>
          </div>

          <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" novalidate>
            {% csrf_token %}
            {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}

            <div class="mb-3">
              <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required autofocus>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
          </form>

          <hr>
          <p class="text-center mb-0">
            Don't have an account? <a href="{% url 'signup' %}" class="fw-bold text-decoration-none">Sign up here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock body %}
